[project]
name = "ghostscribe"
version = "1.0.0"
description = "Bot-free meeting recorder for Windows that turns Teams/Zoom calls into structured minutes with Google Gemini"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/2g4y1/GhostScribe"
Issues = "https://github.com/2g4y1/GhostScribe/issues"
# Runtime dependencies are pinned in requirements.txt (installed by install_requirements.bat),
# development tools in requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
]
ignore = [
    "E501",   # line-too-long (handled by formatter / long prompt strings)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends/BackgroundTasks)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
