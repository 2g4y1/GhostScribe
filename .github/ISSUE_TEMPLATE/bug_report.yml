name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please do not attach recordings, minutes, API keys or other personal data.
        Security problems are reported privately, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GhostScribe version
      description: Shown at the bottom of the settings, e.g. "GhostScribe 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options: [Windows 10, Windows 11, macOS (Apple silicon), macOS (Intel), Linux]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: The messages of the GhostScribe console window around the problem (remove personal data first)
      render: text
