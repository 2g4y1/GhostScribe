name: Release

# A pushed version tag (e.g. v1.1.0) builds the release archive and creates a draft release for it;
# publishing the draft stays a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read # everything else is granted to the job below

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: # only what creating and attesting the release needs
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: The tag matches the version of the package
        run: |
          version="$(python -c 'import ghostscribe; print(ghostscribe.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in ghostscribe/__init__.py"
            exit 1
          fi
      - name: Build the release archive (byte-identical for the same commit)
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python scripts/build_release.py
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "GhostScribe $GITHUB_REF_NAME"
